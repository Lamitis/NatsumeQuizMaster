name: natsume_quiz_master
description: NatsumeQuizMaster —— 本地优先、知识库约束 AI、可插件化的备考刷题工具（Android / Windows）
publish_to: 'none'
version: 1.35.2+30

environment:
  # 标准工具链：Flutter 3.47.8 / Dart 3.13.7（见 .fvmrc），依赖锁定 pdfrx 1.3.5
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # 状态管理
  provider: ^6.1.1
  
  # 数据库
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.1
  path: ^1.8.3
  
  # 文件处理
  # v1.35.1：6.2.1 → 13.x。原因不是「新」，而是 6.x 钉死了 `win32 ^5.x`，
  # 而 flutter_secure_storage 11.x 的 Windows 实现（4.x，FFI 版）要求
  # `win32 ^6.x`，两者无交集 —— 想升级安全存储就必须升 file_picker。
  # 8.0.6~12.x 同样带 `win32 ^5.5.1`（pub 解析会直接冲突），只有 13.x 拆成
  # 分平台包（android_file_picker / windows_file_picker …），不再直接依赖 win32。
  # 代价：13.x 是 API 重写版——`FilePicker.platform` / `FilePickerResult` 没了，
  # 改为静态方法 `FilePicker.pickFile/pickFiles/getDirectoryPath/saveFile`，
  # 返回 `PlatformFile` / `List<PlatformFile>` / `Uri?`（各调用点已同步迁移）。
  file_picker: ^13.3.0
  archive: ^3.4.9
  xml: ^6.3.0
  
  # 网络请求
  http: ^1.1.2
  http_parser: ^4.0.2
  
  # UI组件
  fl_chart: ^0.66.0
  shimmer: ^3.0.0
  flutter_markdown: ^0.7.1
  audioplayers: ^6.1.0
  # share_plus 已移除（v1.34：导出改用 ExportStorage 的「另存为」，不再走系统分享面板）
  
  # 工具
  intl: ^0.18.1
  # 打开外部链接（v1.34 检查更新：跳转发布页下载）
  url_launcher: ^6.3.0
  shared_preferences: 2.5.3
  uuid: ^4.2.1
  path_provider: 2.1.5

  # 每日提醒 + 保活（v1.0.2 新增）
  # v1.35.1：19.x → 22.x（22.3.3 即 pub 上最新稳定版），timezone 随之抬到
  # ^0.11.0（22.x 的硬约束）。
  # 注意：它的 Windows 实现 flutter_local_notifications_windows 3.1.1 虽然标着
  # ffiPlugin，但仍会编译一小段 C++（点击通知的激活回调），里面有
  #   const std::string key = CW2A(item.Key, CP_UTF8);
  # 这类 ATL 隐式转换 —— 新版 MSVC 下是 error C2440，而 pub 上没有已修复的稳定版。
  # 所以由 tools/patch_pub_cache.dart 在 `flutter pub get` 之后改成显式
  # static_cast<LPCSTR>(...)：本机构建与 CI 都会跑，见该脚本头部说明。
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.0
  flutter_timezone: ^4.1.1
  flutter_foreground_task: ^6.0.0

  # 密钥加密（v1.0.2 新增：AES-256-GCM）
  pointycastle: ^3.9.1

  # 同步配对：二维码生成（纯 Dart，无平台代码）+ 扫码（ML Kit 条码识别）
  qr: ^3.0.1
  mobile_scanner: ^5.2.3

  # 哈希（v1.0.2 设计审查：开发者选项密码哈希比对）
  crypto: ^3.0.0

  # 安全存储（v1.0.2 七项改进：Android 上 API Key 走 Keystore 加密，
  # 其他平台回退 KeyCrypto 混淆存储）
  # v1.35.1：9.2.4 → 11.x。旧版 flutter_secure_storage_windows 3.1.2 的 C++
  # 里 `GetValueKey` 漏了类名限定（C4596），且 ATL::CW2A → std::wstring 的隐式
  # 转换在新版 MSVC 下失效（C2440）；4.x 重写了这段 C++（不再用 ATL），两个报错
  # 都已消失，无需再打补丁。
  flutter_secure_storage: ^11.2.0
  pdfrx: 1.3.5
  image: ^4.3.0
  google_mlkit_text_recognition: ^0.15.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  integration_test:
    sdk: flutter
  # 单元测试里伪造 file_picker 的 PlatformFile 需要 XFile 类型
  # （file_picker 13.x 的 PlatformFile.xFile 返回它），本身是 flutter 的传递依赖。
  cross_file: ^0.3.4

flutter:
  uses-material-design: true
  assets:
    - assets/
    # 官方插件资产（v1.35）：目前是陪伴插件的三张助教形象。
    # 只注册 avatars/（PNG，App 渲染用），同目录 masters/ 里的 .ico 母版
    # 刻意不注册——Flutter 的目录条目不含子目录，母版因此不进包体。
    - assets/plugins/official/companion/avatars/
  # v1.27 视觉优化：内置 MiSans（小米开源字体），PC/安卓跨端字形一致，
  # 解决默认微软雅黑小字号发虚观感。只带 Regular + Semibold 两字重（省包体，
  # w500 自动回落 Regular，观感几乎无差）
  fonts:
    - family: MiSans
      fonts:
        - asset: fonts/MiSans-Regular.ttf
        - asset: fonts/MiSans-Semibold.ttf
          weight: 600
