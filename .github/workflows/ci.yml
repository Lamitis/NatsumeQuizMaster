# ============================================================
# NatsumeQuizMaster · 持续集成
# 放置位置：.github/workflows/ci.yml
#
# 作用：每次推送 / PR 自动执行静态分析与全量测试，
#       把「0 error/0 warning」「全量测试全绿」从本地声明变成外部可验证的事实。
#       徽章见 README 首屏（badge.svg 直连本文件）。
#
# 不需要任何 Secrets。
# Flutter 版本与本地开发保持一致（当前 3.47.8，见 .fvmrc；标准工具链 Dart 3.13.7）。
#
# 关于 analyze 的判定标准：仓库有若干 info 级 lint 提示，而 `flutter analyze`
# 对任何级别的 issue 都返回非零退出码。这里用 --no-fatal-infos 与项目既有标准
# 对齐（tools/publish_release.ps1 同样是「error/warning 才算失败」）——warning
# 及以上仍然会让 CI 变红。
#
# 关于「测试为什么要拆 3 个分片 + 每分片 --concurrency=1」（v1.34 修复）：
# 之前是在一个 `flutter test` 里跑完 60+ 个测试文件。`flutter test` 用**一个常驻
# 前端编译器**（frontend_server）按序编译套件，一旦编译器中途死掉，后面所有还没
# 编完的套件都会记成
#     loading /home/runner/.../test/xxx_test.dart [E]
# 于是失败列表看起来像「随手挑了一批文件一起挂掉」（branch 上是 +170 -16，
# 更早 main 上是 462 通过 / 41 个 loading 失败），既不是断言失败、也和被测代码
# 无关——本地 Windows 上同一条命令一次全绿。
# 拆片（每个分片独立进程、独立编译器，内存从「60 个套件累积」降到「20 个」，同一
# 时刻只跑一个 flutter_tester）确实有效，**但它不是这次变红的根因**：
#   v1.34 的真因在依赖侧——pdfrx 1.3.5 原版源码漏了两个 `!`，编译器一编到它就直接
#   报错退出（日志里是
#       Error: Property 'blockSize' cannot be accessed on 'PdfFileCache?' ...
#   ），其余套件便统统记成 loading [E]。本地不复现，是因为 pub 缓存里那份被手工
#   补过，而缓存不进版本控制——典型「环境侧假红」。
#   现在由 tools/patch_pub_cache.dart 把补丁做成必跑的一步（见下方各任务），
#   补丁失效时会直接指出是 pdfrx 源码对不上，不会再伪装成测试基础设施的问题。
# 分片 + 单并发继续保留：既是真 OOM 的防护，也让失败能落到具体分片的
# 具体文件上，而不是混成一锅。
# ============================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # 与 .fvmrc / 本地开发版本保持一致
  FLUTTER_VERSION: '3.47.8'
  # 测试分片数；改这里时同步改 jobs.test.strategy.matrix.shard
  TEST_SHARDS: '3'

jobs:
  analyze:
    name: 静态分析
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 拉取依赖
        run: flutter pub get

      - name: 修补 pub 缓存里的 pdfrx 空安全 bug
        # pdfrx 1.3.5 的原版源码在 lib/src/pdfium/pdf_file_cache.dart 的 351/353 行
        # 漏了两个 `!`（可空参数在闭包内不享受类型提升），干净环境里编译必然失败；
        # 本地之所以能编，是因为 pub 缓存那份被手工补过，而缓存不进版本控制。
        # 详见 tools/patch_pub_cache.dart 头部注释。
        run: dart tools/patch_pub_cache.dart

      - name: 静态分析（要求 0 error / 0 warning；info 级提示不计）
        run: flutter analyze --no-fatal-infos

  test:
    name: 全量测试（分片 ${{ matrix.shard }}）
    needs: analyze
    runs-on: ubuntu-latest
    # 一个分片红了也要能看到其余分片的结果，别被 fail-fast 提前掐掉
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # 测试用 sqflite_common_ffi 跑真实 SQLite；Ubuntu runner 自带
      # libsqlite3.so.0，装上 dev 包是为了拿到无版本号的 .so 软链，避免
      # 个别镜像上 DynamicLibrary.open 失败。
      - name: 安装 SQLite 运行库
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: 拉取依赖
        run: flutter pub get

      # 与 analyze 任务同款（原因见 jobs.analyze 里的注释与 tools/patch_pub_cache.dart）。
      # 少了这一步，失败会伪装成「一堆套件 loading … [E]」，看起来像测试基础设施坏了。
      - name: 修补 pub 缓存里的 pdfrx 空安全 bug
        run: dart tools/patch_pub_cache.dart

      - name: 环境体检（CPU / 内存 / 磁盘，编译器崩溃排查用）
        run: |
          nproc
          free -m
          df -h /

      - name: 全量测试（第 ${{ matrix.shard }} 片 / 共 ${{ env.TEST_SHARDS }} 片）
        # 为什么不用一句 `flutter test`：失败的**用例名**必须能被看到。
        # Actions 的原始日志要仓库管理员权限才能下载（403），而 `::error::`
        # 注解任何人（含 API）都能读——否则失败页只显示「N passed, M failed」，
        # 定位不到是哪条挂的，只能本地反复重跑碰运气。
        #
        # 注解里除了 `[E]` 那一行还要带上它后面 8 行：套件加载失败的真因
        # （Dart 编译器崩溃 / 缺库 / 断言堆栈）就写在那几行里；只抓 `[E]`
        # 行等于只拿到「谁挂了」而不给「为什么挂」——v1.34 排 CI 假红时，
        # 正是靠这层上下文才看出是编译器崩溃而不是用例断言。
        run: |
          set +e
          flutter test \
            --total-shards ${{ env.TEST_SHARDS }} \
            --shard-index ${{ matrix.shard }} \
            --concurrency=1 \
            --reporter expanded > test_output.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            grep -nE '\[E\]' -A8 test_output.log \
              | head -80 | sed 's/^/[failed] /' | while IFS= read -r line; do
                echo "::error::$line"
              done
            grep -nE 'The Dart compiler exited unexpectedly|Failed to load|Cannot open|Out of memory' \
              test_output.log | sed 's/^/[cause] /' || true
            echo "----- 尾部输出 -----"
            tail -80 test_output.log
          else
            tail -3 test_output.log
          fi
          exit "$code"

      # 日志留在 runner 上等于没有（Actions 下载原始日志要管理员权限），
      # 失败时把它挂到 artifact 上，有 repo 读权限的人都能取回全文。
      - name: 上传本分片的测试日志（仅失败时）
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-output-shard-${{ matrix.shard }}
          path: test_output.log
          if-no-files-found: ignore
          retention-days: 14
